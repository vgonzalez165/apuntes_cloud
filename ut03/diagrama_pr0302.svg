<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Marcadores de flechas -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0073BB" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#232F3E" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E8E3E" />
    </marker>
  </defs>

  <!-- AWS REGION -->
  <rect x="20" y="20" width="820" height="580" rx="10" fill="#F9FAFB" stroke="#FF9900" stroke-width="2.5" />
  <rect x="20" y="20" width="230" height="30" rx="6" fill="#FF9900" />
  <text x="32" y="40" fill="#FFFFFF" font-size="13" font-weight="bold" letter-spacing="0.5">AWS REGION (us-east-1)</text>

  <!-- AVAILABILITY ZONE -->
  <rect x="40" y="70" width="780" height="510" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="60" y="96" fill="#232F3E" font-size="14" font-weight="bold">Zona de Disponibilidad A (us-east-1a)</text>

  <!-- INSTANCIA ORIGEN (EC2) -->
  <g transform="translate(65, 120)">
    <rect width="320" height="110" rx="8" fill="#F0F7FF" stroke="#0073BB" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 312 0 Q 320 0 320 8 L 320 32 L 0 32 Z" fill="#0073BB" />
    <text x="16" y="21" fill="#FFFFFF" font-size="14" font-weight="bold">Instancia Origen (EC2)</text>
    <text x="16" y="58" fill="#1F2937" font-size="12.5">• Vol. Raíz (/dev/nvme0n1) [8 GB]</text>
    <text x="16" y="82" fill="#1F2937" font-size="12.5">• Web Server + Archivos prueba</text>
  </g>

  <!-- VOLUMEN EBS SECUNDARIO -->
  <g transform="translate(475, 120)">
    <rect width="320" height="110" rx="8" fill="#F0FDF4" stroke="#1E8E3E" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 312 0 Q 320 0 320 8 L 320 32 L 0 32 Z" fill="#1E8E3E" />
    <text x="16" y="21" fill="#FFFFFF" font-size="14" font-weight="bold">Volumen EBS Secundario</text>
    <text x="16" y="58" fill="#1F2937" font-size="12.5">• Tamaño: 2 GB (gp3)</text>
    <text x="16" y="82" fill="#1F2937" font-size="12.5">• Montaje: /mnt/datos</text>
  </g>

  <!-- CONEXIÓN ATTACH (EBS -> EC2) -->
  <line x1="475" y1="175" x2="397" y2="175" stroke="#1E8E3E" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="412" y="152" width="54" height="20" rx="4" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1" />
  <text x="439" y="166" fill="#1E8E3E" font-size="11" font-weight="bold" text-anchor="middle">Attach</text>

  <!-- FLECHA PASO 1 (EC2 -> AMI) -->
  <path d="M 225 230 L 225 298" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow-dark)" />
  <rect x="235" y="254" width="220" height="24" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
  <text x="242" y="270" fill="#232F3E" font-size="11.5" font-weight="bold">1. "Create Image" (Creación de AMI)</text>

  <!-- AMI PERSONALIZADA -->
  <g transform="translate(65, 305)">
    <rect width="320" height="100" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 312 0 Q 320 0 320 8 L 320 32 L 0 32 Z" fill="#B45309" />
    <text x="16" y="21" fill="#FFFFFF" font-size="14" font-weight="bold">AMI Personalizada (AMI)</text>
    <text x="16" y="56" fill="#1F2937" font-size="12.5">• Snapshot Vol. Raíz (8 GB)</text>
    <text x="16" y="78" fill="#1F2937" font-size="12.5">• Snapshot Vol. Datos (2 GB)</text>
  </g>

  <!-- FLECHA PASO 2 (AMI -> CLON) -->
  <path d="M 225 405 L 225 458" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow-dark)" />
  <rect x="235" y="422" width="200" height="24" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
  <text x="242" y="438" fill="#232F3E" font-size="11.5" font-weight="bold">2. "Launch Instance from AMI"</text>

  <!-- INSTANCIA CLONADA (EC2) -->
  <g transform="translate(65, 465)">
    <rect width="320" height="95" rx="8" fill="#FAF5FF" stroke="#7E22CE" stroke-width="2" />
    <path d="M 0 8 Q 0 0 8 0 L 312 0 Q 320 0 320 8 L 320 32 L 0 32 Z" fill="#7E22CE" />
    <text x="16" y="21" fill="#FFFFFF" font-size="14" font-weight="bold">Instancia Clonada (EC2)</text>
    <text x="16" y="55" fill="#1F2937" font-size="12.5">• Nuevo ID / Nueva IP asignada</text>
    <text x="16" y="77" fill="#1F2937" font-size="12.5">• Mismo entorno y datos clonados</text>
  </g>
</svg>
